<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Canvas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --fg: #eceff4;
      --muted: #9aa3b2;
      --accent: #7aa2ff;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .shell {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    header p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--fg);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button.primary {
      background: color-mix(in srgb, var(--accent) 24%, transparent);
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    }
    main {
      position: relative;
      min-height: 0;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    .fallback {
      padding: 24px;
      max-width: 760px;
    }
    .fallback h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .fallback p {
      margin: 0 0 12px;
      color: var(--muted);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 id="canvas-title">Cursor Canvas</h1>
        <p id="canvas-path"></p>
      </div>
      <div class="actions">
        <button id="copy-path" type="button">Copy path</button>
        <button id="reload-canvas" type="button">Reload</button>
        <button id="open-panda" type="button" class="primary">Focus Panda</button>
      </div>
    </header>
    <main>
      <iframe id="canvas-frame" class="hidden" title="Cursor Canvas"></iframe>
      <div id="canvas-fallback" class="fallback">
        <div id="canvas-status" class="status">Loading canvas…</div>
        <h2 id="canvas-fallback-title">Preparing canvas</h2>
        <p id="canvas-fallback-copy">Registering this canvas with Panda. If the live canvas server is available, it will appear here automatically.</p>
      </div>
    </main>
  </div>
  <script type="module" src="/static/js/cursorCanvasPopup.js"></script>
</body>
</html>
