<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Canvas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --fg: #eceff4;
      --muted: #9aa3b2;
      --accent: #7aa2ff;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .shell {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    header p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--fg);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button.primary {
      background: color-mix(in srgb, var(--accent) 24%, transparent);
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    }
    main {
      position: relative;
      min-height: 0;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    .fallback {
      padding: 24px;
      max-width: 760px;
    }
    .fallback h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .fallback p {
      margin: 0 0 12px;
      color: var(--muted);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 id="canvas-title">Cursor Canvas</h1>
        <p id="canvas-path"></p>
      </div>
      <div class="actions">
        <button id="copy-path" type="button">Copy path</button>
        <button id="reload-canvas" type="button">Reload</button>
        <button id="open-panda" type="button" class="primary">Open in Panda tab</button>
      </div>
    </header>
    <main>
      <iframe id="canvas-frame" class="hidden" title="Cursor Canvas"></iframe>
      <div id="canvas-fallback" class="fallback">
        <div id="canvas-status" class="status">Loading canvas…</div>
        <h2 id="canvas-fallback-title">Preparing canvas</h2>
        <p id="canvas-fallback-copy">Registering this canvas with Panda. If the live canvas server is available, it will appear here automatically.</p>
      </div>
    </main>
  </div>
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const path = params.get('path') || '';
    const titleEl = document.getElementById('canvas-title');
    const pathEl = document.getElementById('canvas-path');
    const frame = document.getElementById('canvas-frame');
    const fallback = document.getElementById('canvas-fallback');
    const statusEl = document.getElementById('canvas-status');
    const fallbackTitle = document.getElementById('canvas-fallback-title');
    const fallbackCopy = document.getElementById('canvas-fallback-copy');
    const copyBtn = document.getElementById('copy-path');
    const reloadBtn = document.getElementById('reload-canvas');
    const openPandaBtn = document.getElementById('open-panda');

    function setStatus(text) {
      statusEl.textContent = text;
    }

    if (!path) {
      titleEl.textContent = 'Canvas path missing';
      fallbackTitle.textContent = 'No canvas path supplied';
      fallbackCopy.textContent = 'Return to Panda and use the Open Canvas button on the agent reply.';
      setStatus('Missing path');
      throw new Error('missing path');
    }

    pathEl.textContent = path;
    titleEl.textContent = path.split('/').pop()?.replace(/\.canvas\.tsx$/, '').replace(/[-_]+/g, ' ') || 'Cursor Canvas';

    async function loadCanvas() {
      setStatus('Registering canvas…');
      const response = await fetch('/api/cursor/canvas/open', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ path }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        fallbackTitle.textContent = 'Canvas registration failed';
        fallbackCopy.textContent = payload.detail || 'Could not register this canvas.';
        setStatus('Registration failed');
        return;
      }
      if (payload.title) titleEl.textContent = payload.title;
      const embedUrl = String(payload.embed_url || '').trim();
      if (embedUrl) {
        setStatus('Live canvas connected');
        fallback.classList.add('hidden');
        frame.src = embedUrl;
        frame.classList.remove('hidden');
        return;
      }
      fallbackTitle.textContent = `${payload.title || 'Canvas'} is ready`;
      fallbackCopy.textContent = 'The canvas file was saved. Use Open in Panda tab to view the registration page, or open the same canvas from the Open Canvas button in the agent overlay.';
      setStatus('Saved — live server not configured');
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(path);
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy path'; }, 1200);
      } catch (_error) {
        window.prompt('Copy canvas path', path);
      }
    });

    reloadBtn.addEventListener('click', () => {
      frame.classList.add('hidden');
      frame.removeAttribute('src');
      fallback.classList.remove('hidden');
      loadCanvas().catch((error) => {
        fallbackCopy.textContent = error instanceof Error ? error.message : 'Canvas load failed';
        setStatus('Load failed');
      });
    });

    openPandaBtn.addEventListener('click', () => {
      window.location.href = `/static/cursor-canvas-popup.html?path=${encodeURIComponent(path)}`;
    });

    loadCanvas().catch((error) => {
      fallbackCopy.textContent = error instanceof Error ? error.message : 'Canvas load failed';
      setStatus('Load failed');
    });
  </script>
</body>
</html>
