# pve-prod: cgroupns socketpair workaround + host ports that do not collide
# with Odysseus (7000 / 8080 / 8100 / 8091).
services:
  pandamonium:
    privileged: true
    security_opt:
      - seccomp:unconfined
    volumes:
      - /mnt/dev-env:/mnt/dev-env:rw
      - /home/labsadmin/.cursor:/home/labsadmin/.cursor:rw
      - /home/labsadmin/.agents:/home/labsadmin/.agents:ro
      - /home/labsadmin/.local/bin:/home/labsadmin/.local/bin:ro
    extra_hosts:
      - "m1.tail61d527.ts.net:192.168.1.2"
      - "m2.tail61d527.ts.net:192.168.1.191"
      - "247laptop.tail61d527.ts.net:192.168.1.98"
      - "vm-hermes:192.168.1.192"
    environment:
      - NPM_CONFIG_CACHE=/app/data/.npm
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://prod.tail61d527.ts.net:7080}
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-https://prod.tail61d527.ts.net:7080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://prod.tail61d527.ts.net:7080,http://127.0.0.1:7080}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - GITLAB_API_URL=${GITLAB_API_URL:-http://192.168.1.211/api/v4}
      - PANDAMONIUM_CURSOR_BRIDGE_URL=http://127.0.0.1:8050
      - PANDAMONIUM_CURSOR_BRIDGE_URLS=http://127.0.0.1:8050,http://192.168.1.2:8050,http://192.168.1.90:8050
      - PANDAMONIUM_PC_CURSOR_BRIDGE_URL=http://pc-cursor-bridge:8051
      - PANDAMONIUM_PC_CURSOR_BRIDGE_URLS=http://pc-cursor-bridge:8051,http://192.168.1.2:8051,http://192.168.1.90:8051
      - PANDAMONIUM_CURSOR_BRIDGE_HOME=/home/labsadmin
      - PANDAMONIUM_CURSOR_SETTING_SOURCES=project,user,plugins
      - PANDAMONIUM_CURSOR_WORKSPACES_JSON={"pandamonium":"/mnt/dev-env/projects/pandamonium"}
      - ODYSSEUS_CURSOR_WORKSPACES_JSON={"pandamonium":"/mnt/dev-env/projects/pandamonium"}
      - PANDAMONIUM_UPDATE_TRIGGER=docker-compose
    ports: !override
      - "127.0.0.1:7080:7000"

  pc-cursor-bridge:
    volumes:
      - /home/labsadmin/.cursor/projects:/cursor-projects:ro
    ports: !override
      - "127.0.0.1:8051:8051"

  searxng:
    privileged: true
    security_opt:
      - seccomp:unconfined
    ports: !override
      - "127.0.0.1:18081:8080"

  chromadb:
    privileged: true
    security_opt:
      - seccomp:unconfined
    ports: !override
      - "127.0.0.1:8110:8000"

  ntfy:
    ports: !override
      - "127.0.0.1:8092:80"
