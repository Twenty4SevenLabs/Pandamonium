services:
  pandamonium:
    build:
      context: .
      args:
        PANDAMONIUM_SOURCE_REVISION: ${PANDAMONIUM_SOURCE_REVISION:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data:z
      - ${APP_LOGS_DIR:-./logs}:/app/logs:z
      # Cookbook remote-server SSH identity. Pandamonium can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Pandamonium
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
      # Browser MCP profile/output cache. The entrypoint repairs only this
      # dedicated mount for PUID/PGID; the baked browser remains image-owned.
      - ${APP_DATA_DIR:-./data}/browser-mcp:/app/.cache/browser-mcp:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the pandamonium user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ${APP_DATA_DIR:-./data}/local:/app/.local:z
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-}
      - UNSLOTH_BASE_URL=${UNSLOTH_BASE_URL:-http://192.168.1.2:8888/v1}
      - UNSLOTH_API_KEY=${UNSLOTH_API_KEY:-}
      - UNSLOTH_M1_API_KEY=${UNSLOTH_M1_API_KEY:-}
      - UNSLOTH_M2_API_KEY=${UNSLOTH_M2_API_KEY:-}
      - UNSLOTH_A1_API_KEY=${UNSLOTH_A1_API_KEY:-}
      - UNSLOTH_IMAC_API_KEY=${UNSLOTH_IMAC_API_KEY:-}
      - UNSLOTH_MINI_API_KEY=${UNSLOTH_MINI_API_KEY:-}
      - UNSLOTH_LAPTOP_API_KEY=${UNSLOTH_LAPTOP_API_KEY:-}
      - UNSLOTH_LAN_PROXY=${UNSLOTH_LAN_PROXY:-http://192.168.1.2:8888}
      - UNSLOTH_M2_BASE_URL=${UNSLOTH_M2_BASE_URL:-http://192.168.1.191:8888/v1}
      - UNSLOTH_A1_BASE_URL=${UNSLOTH_A1_BASE_URL:-http://100.80.146.51:8888/v1}
      - UNSLOTH_EXTRA_BASE_URLS=${UNSLOTH_EXTRA_BASE_URLS:-}
      - PANDAMONIUM_UNSLOTH_WAKE_URL=${PANDAMONIUM_UNSLOTH_WAKE_URL:-http://192.168.1.2:8910/wake}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - PANDAMONIUM_ADMIN_USER=${PANDAMONIUM_ADMIN_USER:-${ODYSSEUS_ADMIN_USER:-admin}}
      - PANDAMONIUM_ADMIN_PASSWORD=${PANDAMONIUM_ADMIN_PASSWORD:-${ODYSSEUS_ADMIN_PASSWORD:-}}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - PANDAMONIUM_INPROCESS_POLLERS=${PANDAMONIUM_INPROCESS_POLLERS:-${ODYSSEUS_INPROCESS_POLLERS:-1}}
      - PANDAMONIUM_INPROCESS_TASKS=${PANDAMONIUM_INPROCESS_TASKS:-${ODYSSEUS_INPROCESS_TASKS:-1}}
      - PANDAMONIUM_SCRIPT_HOST=${PANDAMONIUM_SCRIPT_HOST:-${ODYSSEUS_SCRIPT_HOST:-localhost}}
      - PANDAMONIUM_CHAT_UPLOAD_MAX_BYTES=${PANDAMONIUM_CHAT_UPLOAD_MAX_BYTES:-${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}}
      - PANDAMONIUM_GALLERY_UPLOAD_MAX_BYTES=${PANDAMONIUM_GALLERY_UPLOAD_MAX_BYTES:-${ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES:-104857600}}
      - PANDAMONIUM_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${PANDAMONIUM_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-${ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}}
      - PANDAMONIUM_MEMORY_IMPORT_MAX_BYTES=${PANDAMONIUM_MEMORY_IMPORT_MAX_BYTES:-${ODYSSEUS_MEMORY_IMPORT_MAX_BYTES:-10485760}}
      - PANDAMONIUM_PERSONAL_UPLOAD_MAX_BYTES=${PANDAMONIUM_PERSONAL_UPLOAD_MAX_BYTES:-${ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES:-26214400}}
      - PANDAMONIUM_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${PANDAMONIUM_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-${ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}}
      - PANDAMONIUM_STT_MAX_AUDIO_BYTES=${PANDAMONIUM_STT_MAX_AUDIO_BYTES:-${ODYSSEUS_STT_MAX_AUDIO_BYTES:-26214400}}
      - PANDAMONIUM_ICS_MAX_BYTES=${PANDAMONIUM_ICS_MAX_BYTES:-${ODYSSEUS_ICS_MAX_BYTES:-10485760}}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITLAB_API_URL=${GITLAB_API_URL:-}
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
      - NEON_API_KEY=${NEON_API_KEY:-}
      - FIGMA_API_KEY=${FIGMA_API_KEY:-}
      - AIKIDO_API_KEY=${AIKIDO_API_KEY:-}
      - PANDAMONIUM_CURSOR_API_KEY=${PANDAMONIUM_CURSOR_API_KEY:-}
      - PANDAMONIUM_CURSOR_BRIDGE_URL=${PANDAMONIUM_CURSOR_BRIDGE_URL:-http://127.0.0.1:8050}
      - PANDAMONIUM_CURSOR_BRIDGE_URLS=${PANDAMONIUM_CURSOR_BRIDGE_URLS:-http://127.0.0.1:8050,http://192.168.1.2:8050,http://192.168.1.90:8050}
      - PANDAMONIUM_PC_CURSOR_BRIDGE_URL=${PANDAMONIUM_PC_CURSOR_BRIDGE_URL:-http://pc-cursor-bridge:8051}
      - PANDAMONIUM_PC_CURSOR_BRIDGE_URLS=${PANDAMONIUM_PC_CURSOR_BRIDGE_URLS:-http://pc-cursor-bridge:8051,http://192.168.1.2:8051,http://192.168.1.90:8051}
      - PANDAMONIUM_PC_CURSOR_BRIDGE_TOKEN_FILE=${PANDAMONIUM_PC_CURSOR_BRIDGE_TOKEN_FILE:-/app/data/cursor-bridge/pc-ide-token}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    security_opt:
      # docker-default AppArmor profile on Proxmox LXC blocks AF_UNIX socket
      # creation for non-root users, causing Python asyncio (uvicorn) to crash
      # on startup with PermissionError: [Errno 13] on socketpair().
      - apparmor:unconfined
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
      pc-cursor-bridge:
        condition: service_started
    restart: unless-stopped

  pc-cursor-bridge:
    image: docker.io/library/python:3.14-slim
    working_dir: /app
    command:
      - python3
      - /app/pc_cursor_bridge.py
    volumes:
      - ./services/pc-cursor-bridge/pc_cursor_bridge.py:/app/pc_cursor_bridge.py:ro
      - ./services/pc-cursor-bridge/transcript_io.py:/app/transcript_io.py:ro
      - ${APP_DATA_DIR:-./data}/cursor-bridge/pc-ide-token:/token:ro
      - ${PC_CURSOR_PROJECTS_ROOT:-${HOME}/.cursor/projects}:/cursor-projects:ro
    environment:
      - JARVIS_CURSOR_BRIDGE_ALLOW_LAN=1
      - JARVIS_CURSOR_BRIDGE_HOST=0.0.0.0
      - JARVIS_CURSOR_BRIDGE_HOSTS=0.0.0.0
      - JARVIS_CURSOR_BRIDGE_PORT=8051
      - JARVIS_CURSOR_BRIDGE_TOKEN_FILE=/token
      - JARVIS_CURSOR_PROJECTS_ROOT=/cursor-projects
    restart: unless-stopped

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — pandamonium waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'pandamonium-local-searxng-json-2026-09-03\|odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
